<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battleship Bingo — OSRS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --void:#181009;
    --void-2:#241809;
    --wood:#4a3524;
    --wood-dark:#2e2015;
    --wood-light:#6b4c30;
    --parchment:#e8d9b5;
    --parchment-dark:#d3bd8c;
    --ink:#2b1e12;
    --gold:#c9a227;
    --gold-bright:#f2cf5e;

    --skilling:#1e5fa8;
    --skilling-dk:#123a68;
    --clues:#1f7a4d;
    --clues-dk:#124d30;
    --bosses:#a83232;
    --bosses-dk:#6e1f1f;
    --raids:#8a5fc9;
    --raids-dk:#573a82;
    --misc:#6b6b76;
    --misc-dk:#454550;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,162,39,0.08), transparent 60%),
      repeating-linear-gradient(115deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 6px),
      linear-gradient(180deg, var(--void) 0%, var(--void-2) 100%);
    font-family:'Inter', sans-serif;
    color:var(--parchment);
    padding:28px 16px 60px;
  }

  .wrap{max-width:1280px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:22px;
  }

  .eyebrow{
    font-family:'Inter';
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.85;
    margin-bottom:8px;
  }

  h1{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(28px, 5vw, 46px);
    margin:0 0 6px;
    color:var(--gold-bright);
    text-shadow:
      2px 2px 0 var(--ink),
      0 0 18px rgba(242,207,94,0.25);
    letter-spacing:0.02em;
  }

  .sub{
    font-size:13px;
    color:var(--parchment-dark);
    max-width:560px;
    margin:0 auto;
    line-height:1.5;
  }

  /* progress bar styled like an OSRS hitpoints bar */
  .progress-shell{
    max-width:520px;
    margin:20px auto 4px;
    background:var(--wood-dark);
    border:2px solid var(--gold);
    border-radius:3px;
    padding:4px;
    box-shadow:0 3px 8px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .progress-track{
    position:relative;
    height:18px;
    background:#1a1a1a;
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, #7a1e1e, #c9a227 55%, #3f8f4f);
    transition:width 0.4s ease;
  }
  .progress-label{
    text-align:center;
    font-size:12px;
    letter-spacing:0.06em;
    margin-top:8px;
    color:var(--parchment-dark);
    font-variant-numeric:tabular-nums;
  }
  .progress-label b{color:var(--gold-bright);}

  /* controls row */
  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:18px 0 20px;
  }
  .controls input[type="text"]{
    background:var(--parchment);
    color:var(--ink);
    border:2px solid var(--wood-light);
    border-radius:3px;
    padding:7px 10px;
    font-family:'Inter';
    font-size:13px;
    width:180px;
  }
  .btn{
    font-family:'Inter';
    font-weight:600;
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--parchment);
    background:linear-gradient(180deg, var(--wood-light), var(--wood));
    border:1px solid var(--gold);
    border-radius:3px;
    padding:8px 14px;
    cursor:pointer;
    transition:transform 0.1s ease, filter 0.15s ease;
  }
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:translateY(1px);}
  .btn.danger{border-color:#a83232;}

  /* legend */
  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    margin-bottom:22px;
    font-size:11.5px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--parchment-dark);
  }
  .legend-swatch{
    width:11px;height:11px;border-radius:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4);
  }

  /* board */
  .board-frame{
    background:linear-gradient(180deg, var(--wood-light), var(--wood) 40%, var(--wood-dark));
    border:3px solid var(--gold);
    border-radius:8px;
    padding:14px;
    box-shadow:0 12px 30px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.35);
  }

  .board{
    display:grid;
    grid-template-columns:repeat(14, 1fr);
    gap:5px;
  }

  .tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:3px;
    border:1px solid rgba(0,0,0,0.35);
    background:var(--parchment);
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:4px;
    font-size:9.5px;
    line-height:1.15;
    font-weight:600;
    overflow:hidden;
    transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3);
  }
  .tile:hover{
    transform:translateY(-2px) scale(1.04);
    z-index:2;
    box-shadow:0 6px 14px rgba(0,0,0,0.5);
  }
  .tile:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }

  .tile-cat-bar{
    position:absolute;
    top:0;left:0;right:0;
    height:4px;
  }
  .cat-skilling{background:var(--skilling);}
  .cat-clues{background:var(--clues);}
  .cat-bosses{background:var(--bosses);}
  .cat-raids{background:var(--raids);}
  .cat-misc{background:var(--misc);}

  .tile-text{
    margin-top:3px;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .tile.done{
    background:var(--parchment-dark);
    filter:saturate(0.55) brightness(0.72);
  }
  .tile.done .tile-text{
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
  }
  .hit-mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transform:scale(0.4) rotate(-18deg);
    transition:opacity 0.18s ease, transform 0.22s cubic-bezier(.2,1.4,.4,1);
  }
  .tile.done .hit-mark{opacity:1; transform:scale(1) rotate(-8deg);}
  .hit-mark svg{width:62%; height:62%;}

  footer{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color:var(--parchment-dark);
    opacity:0.7;
  }

  @media (max-width:900px){
    .board{grid-template-columns:repeat(14, 1fr);}
    .tile{font-size:7.4px;padding:2px;}
  }
  @media (max-width:560px){
    .board-frame{padding:8px;}
    .board{gap:3px;}
    .tile{font-size:6.4px;}
  }

  .loading{
    text-align:center;
    padding:40px;
    color:var(--parchment-dark);
    font-size:13px;
  }

  @media (prefers-reduced-motion: reduce){
    .tile, .hit-mark, .progress-fill{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Old School RuneScape · Clan Event</div>
    <h1>Battleship Bingo</h1>
    <p class="sub">196 tiles. Click a tile once your team has completed it to mark it sunk. Progress is shared with everyone viewing this board.</p>
  </header>

  <div class="progress-shell">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="progress-label" id="progressLabel">Loading board…</div>

  <div class="controls">
    <input type="text" id="nameInput" placeholder="Your name (optional)" />
    <button class="btn" id="saveNameBtn">Save name</button>
    <button class="btn danger" id="resetBtn">Reset board</button>
  </div>

  <div class="legend" id="legend"></div>

  <div class="board-frame">
    <div class="board" id="board">
      <div class="loading">Loading tiles…</div>
    </div>
  </div>

  <footer>Click any tile to toggle complete. Board state is stored and synced automatically.</footer>
</div>

<script>
// ---- Source task pool: [category, task, tileCount] ----
// categories: skilling, clues, bosses, raids
const SOURCE = [
  // Skilling & melee gear
  ['skilling',"Karil's piece",2],
  ['skilling',"Dharok's piece",2],
  ['skilling',"Guthan's piece",2],
  ['skilling',"Torag's piece",2],
  ['skilling',"Verac's piece",2],
  ['skilling',"Jad",8],
  ['skilling',"100k Woodcutting exp",2],
  ['skilling',"100k Runecraft exp",2],
  ['skilling',"100k Hunter exp",2],
  ['skilling',"100k Fishing exp",2],
  ['skilling',"100k Agility exp",2],
  ['skilling',"100k Mining exp",2],
  ['skilling',"100k Thieving exp",2],
  ['clues',"Beginner clue x amount",3],
  ['clues',"Easy clue x amount",3],
  ['clues',"Medium clue x amount",3],
  ['clues',"Hard clue x amount",3],

  // Clues & misc drops
  ['clues',">500k drop",8],
  ['bosses',"Ancient shard (non-Skotizo)",4],
  ['clues',"Bottomless bucket",2],
  ['clues',"Cow slips",2],
  ['bosses',"Titan's crown piece",2],
  ['bosses',"Tzhaar drop",2],
  ['clues',"Earn Larran's key",5],
  ['clues',"Brimstone key",5],
  ['bosses',"Immaculate mole skin",2],
  ['clues',"Steel ring",2],
  ['clues',"Quest points",2],
  ['clues',"Diaries",2],
  ['bosses',"Scurry spine",2],
  ['clues',"Monkey tail drop",1],
  ['clues',"Hunter rumour (exclusive)",2],
  ['clues',"Strange old lockpick drop",2],
  ['bosses',"Black mask drop",1],
  ['clues',"Elite clue x amount",3],
  ['clues',"Master clue x amount",3],

  // Boss drops
  ['bosses',"Pet (any)",1],
  ['bosses',"Dragon boots drop",1],
  ['skilling',"GOTR (bag/ring/needle/protector/lantern)",1],
  ['skilling',"Off-hand skilling tool (knife, hammer, chisel)",1],
  ['bosses',"Abyssal whip",3],
  ['bosses',"Vorkath's head",2],
  ['bosses',"Granite hammer",2],
  ['bosses',"Saradomin cudgel",2],
  ['bosses',"Zenyte gem",2],
  ['bosses',"Kree'arra drop (not shard)",4],
  ['bosses',"Zilyana drop (not shard)",4],
  ['bosses',"Kril Tsutsaroth drop (not shard)",4],
  ['bosses',"Bandos drop (not shard)",4],
  ['bosses',"Blood shard",2],
  ['bosses',"Big fish",1],
  ['bosses',"Berserker ring",2],
  ['bosses',"Archer ring",2],
  ['bosses',"Warrior ring",2],
  ['raids',"DT2 unique",1],
  ['bosses',"Slayer boss unique",4],
  ['bosses',"Blood Moon drop",4],
  ['bosses',"Eclipse Moon drop",4],
  ['bosses',"Blue Moon drop",4],
  ['bosses',"Huey unique",2],
  ['bosses',">1m drop",8],
  ['bosses',"Deep sea trolling fish unique",1],
  ['bosses',"Burning claw",1],
  ['bosses',"Seers ring",2],
  ['bosses',"Piece of Sunfire drop",2],
  ['bosses',"Tempoross unique",2],
  ['bosses',"Wintertodt unique",2],
  ['bosses',"Venator shard",2],
  ['bosses',"Pharaoh's sceptre",1],

  // Raids & big ticket
  ['raids',"Nex unique",1],
  ['raids',"Tormented synapse",2],
  ['raids',"Yama unique",1],
  ['raids',"Zulrah unique",3],
  ['raids',"Duke Sucellus unique",1],
  ['raids',"Muspah unique",1],
  ['raids',"Pet (exclusive, no chompy/ele)",1],
  ['raids',"Maggot king fang",1],
  ['raids',"DT2 unique (vestige/axe/ring/pet)",1],
  ['raids',"ToA unique",1],
  ['raids',"ToB unique",1],
  ['raids',"CoX unique",1],
  ['raids',"Crystal armour seed",1],
  ['raids',"Crystal weapon seed",1],

  // placeholders to fill the 14x14 = 196 board (sheet showed 193 when fetched —
  // swap these three for your 3 newest additions any time)
  ['misc',"Bonus tile — add your task",1],
  ['misc',"Bonus tile — add your task",1],
  ['misc',"Bonus tile — add your task",1],
];

const CAT_LABEL = {
  skilling:"Skilling & Gear",
  clues:"Clues & Misc",
  bosses:"Boss Drops",
  raids:"Raids & Big Ticket",
  misc:"Bonus"
};

// flatten
let tiles = [];
SOURCE.forEach(([cat, task, count]) => {
  for(let i=0;i<count;i++) tiles.push({task, cat});
});

// deterministic shuffle so every visitor sees tiles in the same scattered order
function seededShuffle(arr, seed){
  let s = seed;
  const rand = () => {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
tiles = seededShuffle(tiles, 8675309).slice(0,196);

const TOTAL = tiles.length;

// ---- render legend ----
const legendEl = document.getElementById('legend');
Object.keys(CAT_LABEL).filter(k=>k!=='misc').forEach(cat=>{
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-swatch cat-${cat}" style="background:var(--${cat})"></span>${CAT_LABEL[cat]}`;
  legendEl.appendChild(item);
});

// ---- render board ----
const boardEl = document.getElementById('board');
let state = new Array(TOTAL).fill(false);

function hitMarkSVG(){
  return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="10" fill="#7a1e1e" opacity="0.9"/>
    <path d="M7 7 L17 17 M17 7 L7 17" stroke="#f2cf5e" stroke-width="2.4" stroke-linecap="round"/>
  </svg>`;
}

function renderBoard(){
  boardEl.innerHTML = '';
  tiles.forEach((t, i) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'tile' + (state[i] ? ' done' : '');
    el.title = t.task;
    el.setAttribute('aria-pressed', state[i] ? 'true' : 'false');
    el.innerHTML = `
      <div class="tile-cat-bar cat-${t.cat}"></div>
      <div class="tile-text">${t.task}</div>
      <div class="hit-mark">${hitMarkSVG()}</div>
    `;
    el.addEventListener('click', () => toggleTile(i));
    boardEl.appendChild(el);
  });
  updateProgress();
}

function updateProgress(){
  const done = state.filter(Boolean).length;
  const pct = Math.round((done/TOTAL)*100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `<b>${done}</b> / ${TOTAL} tiles sunk (${pct}%)`;
}

async function loadState(){
  try{
    const result = await window.storage.get('board-state', true);
    if(result && result.value){
      const saved = JSON.parse(result.value);
      if(Array.isArray(saved) && saved.length === TOTAL){
        state = saved;
      }
    }
  }catch(e){
    // no saved state yet — start fresh
  }
  renderBoard();
}

async function saveState(){
  try{
    await window.storage.set('board-state', JSON.stringify(state), true);
  }catch(e){
    console.error('Could not save board state', e);
  }
}

function toggleTile(i){
  state[i] = !state[i];
  renderBoard();
  saveState();
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Reset the entire board for everyone? This cannot be undone.')){
    state = new Array(TOTAL).fill(false);
    renderBoard();
    saveState();
  }
});

// ---- name (personal, local only) ----
async function loadName(){
  try{
    const result = await window.storage.get('player-name', false);
    if(result && result.value){
      document.getElementById('nameInput').value = result.value;
    }
  }catch(e){}
}
document.getElementById('saveNameBtn').addEventListener('click', async () => {
  const val = document.getElementById('nameInput').value.trim();
  try{
    await window.storage.set('player-name', val, false);
  }catch(e){}
});

loadName();
loadState();
</script>
</body>
</html>
